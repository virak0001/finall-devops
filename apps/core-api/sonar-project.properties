# SonarQube analysis settings for the core service.
#
# Read by sonar-scanner-cli from sonar.projectBaseDir, which the Jenkinsfile
# points at $WORKSPACE. Without this file the scan fails outright — the
# pipeline passes no -Dsonar.projectKey, and the scanner refuses to run without
# a project identity.
#
# This is NOT a Maven project despite the mvn command SonarQube's UI suggests;
# that page defaults to Maven. sonar-maven-plugin would ignore this file and
# read pom.xml, which does not exist here.
#
# Anything the pipeline passes on the command line WINS over this file, which
# is why projectVersion is deliberately absent: the Jenkinsfile supplies it as
# -Dsonar.projectVersion="$IMAGE_TAG" so each analysis is stamped with the
# image it describes. Setting it here would be dead config that looks
# authoritative.

sonar.projectKey=core-service
sonar.projectName=Core Service

# Unit tests live beside the code under src/ (jest rootDir=src,
# testRegex=.*\.spec\.ts$), while e2e tests sit in their own top-level test/
# directory. Both are listed as tests so neither is analysed as production
# code — an e2e file counted as a source inflates duplication and issue counts
# against code that never ships.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Excluded from the SOURCES side only; the files above are still analysed, as
# tests. Listing them in both places is what prevents "File can't be indexed
# twice", which fails the scan rather than warning.
#
# dist/ is excluded because it is committed here: analysing compiled output
# would double every finding and report the transpiler's style as yours.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.e2e-spec.ts

# jest writes to ../coverage relative to rootDir=src, i.e. ./coverage. The
# pipeline does not currently run `npm run test:cov`, so this path will not
# exist and coverage reports as 0%. That matters because the Quality Gate stage
# uses abortPipeline: true — a gate with a coverage condition will fail every
# build until a test stage exists.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
